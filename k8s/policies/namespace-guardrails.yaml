# Per-namespace budget in Kubernetes terms: a ResourceQuota caps the total a team can
# reserve; a LimitRange gives sane defaults to containers that forget requests.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-quota
  namespace: shop
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.memory: 24Gi
    persistentvolumeclaims: "10"
    services.loadbalancers: "1"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: shop
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        memory: 512Mi
      max:
        cpu: "2"
        memory: 4Gi
